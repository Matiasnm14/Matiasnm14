name: Update profile stats

on:
  schedule:
    # 00:17 in Bolivia (04:17 UTC), away from the busiest minute.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_stats.py
      - tests/test_update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test statistics calculation
        run: python -m unittest discover -s tests -v
      - name: Read public statistics and update README
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_stats.py
      - name: Save updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "Statistics are already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh profile statistics'
          git push origin HEAD:main
